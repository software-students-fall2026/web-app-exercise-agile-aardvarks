
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Game Reviews{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">Game Reviews</a>
        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="{{ url_for('search') }}" class="{% if request.path == '/search' %}active{% endif %}">Search</a>
            <a href="{{ url_for('add_game') }}" class="{% if request.path == '/add-game' %}active{% endif %}">Add Game</a>
            <a href="{{ url_for('create_account') }}" class="create-account-btn">Create Account</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
