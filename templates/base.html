<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Game Reviews{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">Game Reviews</a>
        {% set route = request.endpoint or '' %}
        <nav class="nav-links">
            <a href="{{ url_for('home') }}" class="{% if route in ('home', 'game_detail', 'write_review', 'edit_review', 'edit_game') %}active{% endif %}">Home</a>

            <a href="{{ url_for('search') }}" class="{% if route == 'search' %}active{% endif %}">Search</a>

            <a href="{{ url_for('add_game') }}" class="{% if route == 'add_game' %}active{% endif %}">Add Game</a>

            {% if current_user.is_authenticated %}

                <span class="nav-username">
                    {{ current_user.username }}
                </span>
            
                <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
                    <button type="submit" class="logout-btn">Log Out</button>
                </form>
        
            {% else %}
        
                <a href="{{ url_for('login') }}" class="login-btn">Log In</a>
            
                <a href="{{ url_for('create_account') }}" class="create-account-btn">
                    Create Account
                </a>
        
            {% endif %}
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>

    <script>
    document.querySelectorAll("[data-max]").forEach(el => {
        const max = Number(el.dataset.max);
        const counter = document.createElement("div");
        counter.className = "counter";
        el.insertAdjacentElement("afterend", counter);
        const update = () => {
            counter.textContent = el.value.length + " / " + max;
            counter.classList.toggle("over", el.value.length > max);
        };
        el.addEventListener("input", update);
        update();
    });
    </script>
</body>
</html>
