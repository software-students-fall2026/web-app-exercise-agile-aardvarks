{% extends "base.html" %}

{% block title %}{{ "Edit Game" if editing else "Add a Game" }} · Game Reviews{% endblock %}

{% block content %}
    <section class="review-form">
        <h1>{{ "Edit Game" if editing else "Add a Game" }}</h1>

        {% if errors %}
            <ul class="errors">
            {% for e in errors %}<li>{{ e }}</li>{% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ form.title }}" data-max="{{ limits.title }}" required>
            </div>

            <div class="field-row">
                <div class="field grow">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre" value="{{ form.genre }}" data-max="{{ limits.genre }}" required>
                </div>
                <div class="field grow">
                    <label for="platform">Platform</label>
                    <input type="text" id="platform" name="platform" value="{{ form.platform }}" data-max="{{ limits.platform }}" required>
                </div>
            </div>

            <div class="field">
                <label for="year">Year</label>
                <input type="text" id="year" name="year" min="{{ year_min }}" max="{{ year_max }}" value="{{ form.year }}" required>
            </div>

            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" data-max="{{ limits.description }}" required>{{ form.description }}</textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">{{ "Save Changes" if editing else "Add Game" }}</button>
                <a class="btn btn-secondary" href="{{ url_for('game_detail', game_id=game._id) if editing else  url_for('home') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
