{% extends "base.html" %}

{% block content %}
<h1>Add a Game</h1>
<form method="POST">
    <label for="title">Title</label>
    <input 
        type="text"
        id="title"
        name="title"
        required
    >
    <br>
    <label for="genre">Genre</label>
    <input 
        type="text"
        id="genre"
        name="genre"
        required
    >
    <br>
    <label for="platform">Platform</label>
    <input 
        type="text"
        id="platform"
        name="platform"
        required
    >
    <br>
    <label for="year">Year</label>
    <input 
        type="number"
        id="year"
        name="year"
        required
    >
    <br>
    <label for="description">Description</label>
    <textarea
        id="description"
        name="description"
        rows="1"
        cols="40"
        required
    ></textarea>
    <br>
    <button type="submit">Add Game</button>
</form>
{% endblock %}
